<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mes lectures</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #f7f3ed;
      color: #302c28;
    }

    header {
      padding: 55px 20px 40px;
      text-align: center;
      background: #e8dfd2;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 48px;
      font-weight: normal;
    }

    header p {
      margin: 0;
      font-size: 18px;
      color: #6d6258;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .search {
      display: flex;
      gap: 12px;
      margin-bottom: 35px;
    }

    .search input,
    .search select {
      padding: 14px;
      border: 1px solid #d2c7ba;
      border-radius: 8px;
      background: white;
      font-size: 16px;
    }

    .search input {
      flex: 1;
    }

    .books {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
    }

    .book {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .book:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.10);
    }

    .cover {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: #ddd;
    }

    .book-content {
      padding: 18px;
    }

    .book h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .author {
      color: #756a60;
      margin-bottom: 10px;
    }

    .genre {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #eee6dc;
      font-size: 13px;
      color: #65594e;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #756a60;
    }

    .hidden {
      display: none;
    }

    /* PAGE DÉTAIL */

    .back-button {
      display: inline-block;
      margin-bottom: 30px;
      color: #5d5146;
      text-decoration: none;
      font-size: 16px;
      cursor: pointer;
    }

    .back-button:hover {
      text-decoration: underline;
    }

    .detail {
      background: white;
      border-radius: 14px;
      padding: 35px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .detail-top {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 40px;
      margin-bottom: 40px;
    }

    .detail-cover {
      width: 100%;
      max-height: 430px;
      object-fit: cover;
      border-radius: 8px;
    }

    .detail h1 {
      font-size: 42px;
      font-weight: normal;
      margin-top: 0;
      margin-bottom: 10px;
    }

    .detail-author {
      font-size: 21px;
      color: #756a60;
      margin-bottom: 25px;
    }

    .info {
      color: #62584f;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .section {
      margin-top: 35px;
    }

    .section h2 {
      font-size: 27px;
      font-weight: normal;
      border-bottom: 1px solid #ddd3c8;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .summary {
      line-height: 1.8;
      white-space: pre-line;
    }

    .character {
      padding: 18px 0;
      border-bottom: 1px solid #eee7df;
    }

    .character:last-child {
      border-bottom: none;
    }

    .character h3 {
      margin: 0 0 7px;
      font-size: 20px;
    }

    .character p {
      margin: 0;
      color: #665c53;
      line-height: 1.7;
    }

    @media (max-width: 700px) {

      header h1 {
        font-size: 38px;
      }

      .search {
        flex-direction: column;
      }

      .detail {
        padding: 22px;
      }

      .detail-top {
        grid-template-columns: 1fr;
      }

      .detail h1 {
        font-size: 34px;
      }

    }
  </style>
</head>

<body>

<header>
  <h1>Mes lectures</h1>
  <p>Les livres que j'ai lus, au fil des pages.</p>
</header>


<!-- ========================= -->
<!-- PAGE BIBLIOTHÈQUE -->
<!-- ========================= -->

<main id="libraryPage" class="container">

  <div class="search">

    <input
      type="text"
      id="search"
      placeholder="Rechercher un livre ou un auteur..."
    >

    <select id="genre">
      <option value="">Tous les genres</option>
    </select>

  </div>

  <div id="books" class="books"></div>

</main>


<!-- ========================= -->
<!-- PAGE DÉTAIL DU LIVRE -->
<!-- ========================= -->

<main id="detailPage" class="container hidden">

  <a class="back-button" onclick="retourBibliotheque()">
    ← Retour à mes lectures
  </a>

  <div id="detailContent"></div>

</main>


<script>

  // ==================================================
  // CONNEXION SUPABASE
  // ==================================================

  const SUPABASE_URL =
    "https://cjecagqgpqhzawspqzjs.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_8hwEc6y0qiL-vCtUGZ-XVA_Z-SSQKc9";


  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // ==================================================
  // VARIABLES
  // ==================================================

  let livres = [];


  // ==================================================
  // CHARGEMENT DES LIVRES
  // ==================================================

  async function chargerLivres() {

    const { data, error } = await supabaseClient
      .from("livres")
      .select("*")
      .order("date_lecture", { ascending: false });


    if (error) {

      console.error(error);

      document.getElementById("books").innerHTML = `
        <div class="empty">

          <h2>Impossible de charger les livres</h2>

          <p>
            Vérifie la connexion à Supabase.
          </p>

        </div>
      `;

      return;
    }


    livres = data || [];

    remplirGenres();

    afficherLivres();

  }


  // ==================================================
  // GENRES
  // ==================================================

  function remplirGenres() {

    const select =
      document.getElementById("genre");


    const genres = [
      ...new Set(
        livres
          .map(livre => livre.genre)
          .filter(Boolean)
      )
    ];


    genres.sort();


    select.innerHTML =
      `<option value="">Tous les genres</option>`;


    genres.forEach(genre => {

      const option =
        document.createElement("option");

      option.value = genre;

      option.textContent = genre;

      select.appendChild(option);

    });

  }


  // ==================================================
  // AFFICHAGE DES LIVRES
  // ==================================================

  function afficherLivres() {

    const recherche =
      document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const genre =
      document.getElementById("genre").value;


    const livresFiltres =
      livres.filter(livre => {

        const correspondRecherche =
          !recherche ||
          livre.titre
            .toLowerCase()
            .includes(recherche) ||
          livre.auteur
            .toLowerCase()
            .includes(recherche);


        const correspondGenre =
          !genre ||
          livre.genre === genre;


        return (
          correspondRecherche &&
          correspondGenre
        );

      });


    const container =
      document.getElementById("books");


    container.innerHTML = "";


    if (livresFiltres.length === 0) {

      container.innerHTML = `
        <div class="empty">

          <h2>Aucun livre pour le moment</h2>

          <p>
            Ta bibliothèque apparaîtra ici.
          </p>

        </div>
      `;

      return;
    }


    livresFiltres.forEach(livre => {

      const article =
        document.createElement("article");


      article.className = "book";


      const couverture =
        livre.couverture ||
        "https://via.placeholder.com/400x600?text=Pas+de+couverture";


      article.innerHTML = `

        <img
          class="cover"
          src="${couverture}"
          alt="Couverture de ${livre.titre}"
        >

        <div class="book-content">

          <h2>${livre.titre}</h2>

          <div class="author">
            ${livre.auteur}
          </div>

          ${
            livre.genre
              ? `<span class="genre">${livre.genre}</span>`
              : ""
          }

        </div>

      `;


      article.addEventListener(
        "click",
        () => afficherDetail(livre.id)
      );


      container.appendChild(article);

    });

  }


  // ==================================================
  // AFFICHER LE DÉTAIL
  // ==================================================

  async function afficherDetail(id) {

    const livre =
      livres.find(
        livre => livre.id === id
      );


    if (!livre) {
      return;
    }


    const { data: personnages, error } =
      await supabaseClient
        .from("personnages")
        .select("*")
        .eq("livre_id", id)
        .order("id");


    if (error) {

      console.error(error);

      return;
    }


    document
      .getElementById("libraryPage")
      .classList.add("hidden");


    document
      .getElementById("detailPage")
      .classList.remove("hidden");


    const couverture =
      livre.couverture ||
      "https://via.placeholder.com/400x600?text=Pas+de+couverture";


    let personnagesHTML = "";


    if (!personnages || personnages.length === 0) {

      personnagesHTML = `
        <p>
          Aucun personnage renseigné pour le moment.
        </p>
      `;

    } else {

      personnagesHTML =
        personnages.map(personnage => `

          <div class="character">

            <h3>
              ${personnage.nom}
            </h3>

            <p>
              ${personnage.description || ""}
            </p>

          </div>

        `).join("");

    }


    document.getElementById("detailContent").innerHTML = `

      <div class="detail">

        <div class="detail-top">

          <div>

            <img
              class="detail-cover"
              src="${couverture}"
              alt="Couverture de ${livre.titre}"
            >

          </div>


          <div>

            <h1>
              ${livre.titre}
            </h1>

            <div class="detail-author">
              ${livre.auteur}
            </div>


            <div class="info">

              ${
                livre.genre
                  ? `<strong>Genre :</strong> ${livre.genre}<br>`
                  : ""
              }

              ${
                livre.date_lecture
                  ? `<strong>Lecture :</strong> ${formaterDate(livre.date_lecture)}<br>`
                  : ""
              }

              ${
                livre.pages
                  ? `<strong>Pages :</strong> ${livre.pages}`
                  : ""
              }

            </div>

          </div>

        </div>


        ${
          livre.resume
            ? `
              <div class="section">

                <h2>Résumé</h2>

                <div class="summary">
                  ${livre.resume}
                </div>

              </div>
            `
            : ""
        }


        <div class="section">

          <h2>Personnages</h2>

          ${personnagesHTML}

        </div>

      </div>

    `;

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  // ==================================================
  // RETOUR BIBLIOTHÈQUE
  // ==================================================

  function retourBibliotheque() {

    document
      .getElementById("detailPage")
      .classList.add("hidden");


    document
      .getElementById("libraryPage")
      .classList.remove("hidden");


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  // ==================================================
  // DATE
  // ==================================================

  function formaterDate(date) {

    const dateObj =
      new Date(date);


    return dateObj.toLocaleDateString(
      "fr-FR",
      {
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );

  }


  // ==================================================
  // RECHERCHE
  // ==================================================

  document
    .getElementById("search")
    .addEventListener(
      "input",
      afficherLivres
    );


  document
    .getElementById("genre")
    .addEventListener(
      "change",
      afficherLivres
    );


  // ==================================================
  // DÉMARRAGE
  // ==================================================

  chargerLivres();

</script>

</body>
</html>
