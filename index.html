<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mes lectures</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #f7f3ed;
      color: #302c28;
    }

    header {
      padding: 60px 20px 40px;
      text-align: center;
      background: #e8dfd2;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 48px;
      font-weight: normal;
    }

    header p {
      margin: 0;
      font-size: 18px;
      color: #6d6258;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .search {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
    }

    .search input,
    .search select {
      padding: 14px;
      border: 1px solid #d2c7ba;
      border-radius: 8px;
      background: white;
      font-size: 16px;
    }

    .search input {
      flex: 1;
    }

    .books {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
    }

    .book {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .cover {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: #ddd;
    }

    .book-content {
      padding: 18px;
    }

    .book h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .author {
      color: #756a60;
      margin-bottom: 10px;
    }

    .genre {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #eee6dc;
      font-size: 13px;
      color: #65594e;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #756a60;
    }

    @media (max-width: 650px) {
      header h1 {
        font-size: 38px;
      }

      .search {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Mes lectures</h1>
  <p>Les livres que j'ai lus, au fil des pages.</p>
</header>

<main class="container">

  <div class="search">
    <input
      type="text"
      id="search"
      placeholder="Rechercher un livre ou un auteur..."
    >

    <select id="genre">
      <option value="">Tous les genres</option>
    </select>
  </div>

  <div id="books" class="books"></div>

</main>

<script>

  // --------------------------------------------------
  // CONNEXION SUPABASE
  // --------------------------------------------------

  const SUPABASE_URL = "https://cjecagqgpqhzawspqzjs.supabase.co";

  const SUPABASE_KEY = "sb_publishable_8hwEc6y0qiL-vCtUGZ-XVA_Z-SSQKc9";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // --------------------------------------------------
  // VARIABLES
  // --------------------------------------------------

  let livres = [];


  // --------------------------------------------------
  // CHARGER LES LIVRES
  // --------------------------------------------------

  async function chargerLivres() {

    const { data, error } = await supabaseClient
      .from("livres")
      .select("*")
      .order("date_lecture", { ascending: false });

    if (error) {
      console.error(error);

      document.getElementById("books").innerHTML = `
        <div class="empty">
          <h2>Impossible de charger les livres</h2>
          <p>Vérifie la connexion à Supabase.</p>
        </div>
      `;

      return;
    }

    livres = data || [];

    remplirGenres();
    afficherLivres();

  }


  // --------------------------------------------------
  // GENRES
  // --------------------------------------------------

  function remplirGenres() {

    const select = document.getElementById("genre");

    const genres = [...new Set(
      livres
        .map(livre => livre.genre)
        .filter(Boolean)
    )];

    genres.sort();

    select.innerHTML = `<option value="">Tous les genres</option>`;

    genres.forEach(genre => {

      const option = document.createElement("option");

      option.value = genre;
      option.textContent = genre;

      select.appendChild(option);

    });

  }


  // --------------------------------------------------
  // AFFICHAGE
  // --------------------------------------------------

  function afficherLivres() {

    const recherche =
      document.getElementById("search").value
      .toLowerCase()
      .trim();

    const genre =
      document.getElementById("genre").value;

    const livresFiltres = livres.filter(livre => {

      const correspondRecherche =
        !recherche ||
        livre.titre.toLowerCase().includes(recherche) ||
        livre.auteur.toLowerCase().includes(recherche);

      const correspondGenre =
        !genre || livre.genre === genre;

      return correspondRecherche && correspondGenre;

    });


    const container = document.getElementById("books");

    container.innerHTML = "";


    if (livresFiltres.length === 0) {

      container.innerHTML = `
        <div class="empty">
          <h2>Aucun livre pour le moment</h2>
          <p>Ta bibliothèque apparaîtra ici.</p>
        </div>
      `;

      return;

    }


    livresFiltres.forEach(livre => {

      const article = document.createElement("article");

      article.className = "book";


      const couverture =
        livre.couverture ||
        "https://via.placeholder.com/400x600?text=Pas+de+couverture";


      article.innerHTML = `
        <img
          class="cover"
          src="${couverture}"
          alt="Couverture de ${livre.titre}"
        >

        <div class="book-content">

          <h2>${livre.titre}</h2>

          <div class="author">
            ${livre.auteur}
          </div>

          ${
            livre.genre
              ? `<span class="genre">${livre.genre}</span>`
              : ""
          }

        </div>
      `;


      container.appendChild(article);

    });

  }


  // --------------------------------------------------
  // RECHERCHE
  // --------------------------------------------------

  document
    .getElementById("search")
    .addEventListener("input", afficherLivres);


  document
    .getElementById("genre")
    .addEventListener("change", afficherLivres);


  // --------------------------------------------------
  // DÉMARRAGE
  // --------------------------------------------------

  chargerLivres();

</script>

</body>
</html>
