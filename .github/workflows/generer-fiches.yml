
name: Generer les fiches des livres

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generer les fiches
        run: node scripts/generer-fiches.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Enregistrer les fiches generees
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Generer les fiches des livres"
          file_pattern: "livres/** livres.html sitemap.xml"
```
