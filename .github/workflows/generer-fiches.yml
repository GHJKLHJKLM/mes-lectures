name: Generer les fiches des livres

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generer les fiches
        run: node scripts/generer-fiches.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Enregistrer les fiches generees
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add livres livres.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Aucune modification."
            exit 0
          fi
          git commit -m "Generer les fiches des livres"
          git pull --rebase origin main
          git push origin HEAD:main
